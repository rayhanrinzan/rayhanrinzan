name: Update contribution graph

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/contributions.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate contribution calendar
        run: python .github/scripts/generate_contributions.py

      - name: Commit updated calendar
        run: |
          if [ -z "$(git status --porcelain -- assets/contributions-dark.svg assets/contributions-light.svg)" ]; then
            echo "Contribution graph is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contributions-dark.svg assets/contributions-light.svg
          git commit -m "Update contribution graph"
          git push
